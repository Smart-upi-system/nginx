events {
    worker_connections 2048;
}

http {

    # ── Rate Limiting Zones ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:10m      rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m         rate=5r/m;
    limit_req_zone $binary_remote_addr zone=transaction:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=fraud:10m        rate=20r/m;

    # ── Upstream — API Gateway on port 4000 ───────────────────────────────────
    upstream api_gateway {
        server api-gateway:4000;
        keepalive 32;
    }

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request_method $request_uri" '
                    'status=$status bytes=$body_bytes_sent '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain application/xml;
    gzip_min_length 1024;

    # ── Common Proxy Headers (reusable snippet) ────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";       # enable keepalive to gateway

    server {
        listen 8080;
        server_name localhost;

        # ── Security Headers ───────────────────────────────────────────────────
        add_header X-Frame-Options        DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection       "1; mode=block";
        add_header Referrer-Policy        "no-referrer";

        # ── Nginx Health (does NOT hit Spring Boot) ────────────────────────────
        location /health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # ── Block Actuator from public access ─────────────────────────────────
        location /actuator/ {
            return 403;
        }

        # ── Block internal paths ───────────────────────────────────────────────
        location ~* /internal/ {
            return 403;
        }

        # ── Auth Service  →  /auth/** ──────────────────────────────────────────
        # Tightest limit — prevents brute force on login/register
        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;    # matches gateway httpclient timeout
        }

        # ── User Service  →  /users/** ────────────────────────────────────────
        location /users/ {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Transaction Service  →  /transaction/** ───────────────────────────
        # Matches your rate-limit.transaction config (10 req/s capacity)
        location /transaction/ {
            limit_req zone=transaction burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Ledger Service  →  /ledger/** ─────────────────────────────────────
        location /ledger/ {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Wallet Service  →  /wallet/** ─────────────────────────────────────
        location /wallet/ {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Fraud Service  →  /fraud/** ───────────────────────────────────────
        location /fraud/ {
            limit_req zone=fraud burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Notification Service  →  /notification/** ────────────────────────
        location /notification/ {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Unknown route  →  consistent JSON 404 ────────────────────────────
        location / {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"Route not found."}';
        }

        # ── 429 Too Many Requests custom response ─────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"status":429,"error":"Too Many Requests","message":"Rate limit exceeded. Please slow down."}';
        }

        # ── 502/504 custom response ────────────────────────────────────────────
        error_page 502 /502.json;
        location = /502.json {
            internal;
            default_type application/json;
            return 502 '{"status":502,"error":"Bad Gateway","message":"Service temporarily unavailable."}';
        }

        error_page 504 /504.json;
        location = /504.json {
            internal;
            default_type application/json;
            return 504 '{"status":504,"error":"Gateway Timeout","message":"The service took too long to respond."}';
        }
    }
}